[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracecase"
version = "0.2.0"
description = "Record browser actions and generate structured QA test cases with screenshots, network, and console context"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Tracecase Team" }
]
keywords = ["testing", "qa", "browser", "playwright", "test-case", "testcase", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "pillow>=12.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
tracecase = "tracecase.cli:app"

[project.urls]
Homepage = "https://github.com/Ganesh1110/Tracecase"
Repository = "https://github.com/Ganesh1110/Tracecase"
Issues = "https://github.com/Ganesh1110/Tracecase/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tracecase"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B", "SIM", "E741"]  # Line length handled by formatter, B/SIM/E741 for legacy compatibility

[tool.ruff.lint.isort]
known-first-party = ["tracecase"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_decorators = false
disallow_subclassing_any = false
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pydantic.*", "typer.*", "rich.*", "playwright.*", "PIL.*", "jinja2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "llm: marks tests that require a local language model (skipped by default)",
]
timeout = 30
filterwarnings = [
    "ignore::DeprecationWarning",
]

