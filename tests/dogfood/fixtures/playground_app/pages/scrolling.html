<!DOCTYPE html>
<html>
<head><title>Scrolling Test</title></head>
<body style="height:3500px; padding:20px;">
  <h2>Top of Long Page</h2>
  <p>Scroll down to reach the bottom target element.</p>
  <div style="margin-top:2800px; background:#fef08a; padding:30px;" id="bottom-marker">
    <h3>Bottom Target Reached!</h3>
    <button id="btn-bottom" onclick="this.innerText="Bottom Clicked";">Click at Bottom</button>
  </div>
</body>
</html>
